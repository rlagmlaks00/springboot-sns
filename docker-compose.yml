services:
  postgres:
    image: postgres:17-alpine
    container_name: springboot-sns-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: snsdb
      POSTGRES_USER: sns
      POSTGRES_PASSWORD: sns1234
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sns -d snsdb"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: springboot-sns-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
