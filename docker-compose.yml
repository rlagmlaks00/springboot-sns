services:
  postgres:
    image: postgres:17-alpine
    container_name: springboot-sns-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: snsdb
      POSTGRES_USER: sns
      POSTGRES_PASSWORD: sns1234
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sns -d snsdb"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: springboot-sns-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  rustfs:
    image: minio/minio:latest
    container_name: springboot-sns-rustfs
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: rustfsadmin
      MINIO_ROOT_PASSWORD: rustfsadmin
    volumes:
      - rustfs-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mc-init:
    image: minio/mc:latest
    container_name: springboot-sns-mc-init
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://rustfs:9000 rustfsadmin rustfsadmin &&
      mc mb --ignore-existing local/media &&
      echo 'Bucket created: media'
      "
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
