spring:
  application:
    name: springboot-sns
  data:
    redis:
      host: localhost
      port: 6379
  session:
    store-type: redis
  datasource:
    url: jdbc:postgresql://localhost:5433/snsdb
    driver-class-name: org.postgresql.Driver
    username: sns
    password: sns1234
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
logging:
  level:
    io.lettuce.core: INFO
    org.springframework.data.redis: INFO
    org.springframework.session: INFO
