spring:
  application:
    name: springboot-sns
  data:
    redis:
      host: localhost
      port: 6380
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  session:
    store-type: redis
  datasource:
    url: jdbc:postgresql://localhost:5433/snsdb
    driver-class-name: org.postgresql.Driver
    username: sns
    password: sns1234
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
post:
  edit-window: 1h
rustfs:
  endpoint: http://localhost:9000
  console-port: 9001
  access-key: rustfsadmin
  secret-key: rustfsadmin
  bucket: media
  region: ap-northeast-2
  view-sync-interval: 60000
logging:
  level:
    io.lettuce.core: INFO
    org.springframework.data.redis: INFO
    org.springframework.session: INFO
